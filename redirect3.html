
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting...</title>
    <script>
      const img = new Image();
      img.src = "https://head-gif.onrender.com/images/q4stats.gif?uid=pingufire";

      img.onload = () => {
        window.location.href = "https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExOXdxZGFtaGFsemw3M2N4dm12bzRiM3c2dzc3NWo2MG81MnhyaHJxeCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/ZhS9PL4HQO6o9s96ce/giphy.gif";
      };

      // Fallback in case pixel fails to load
      setTimeout(() => {
        window.location.href = "https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExOXdxZGFtaGFsemw3M2N4dm12bzRiM3c2dzc3NWo2MG81MnhyaHJxeCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/ZhS9PL4HQO6o9s96ce/giphy.gif";
      }, 1000);
    </script>
  </head>
  <body>
    <!-- Transparent fallback if JS is disabled -->
    <noscript>
      <meta http-equiv="refresh" content="1; url=https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExOXdxZGFtaGFsemw3M2N4dm12bzRiM3c2dzc3NWo2MG81MnhyaHJxeCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/ZhS9PL4HQO6o9s96ce/giphy.gif">
    </noscript>
  </body>
</html>
