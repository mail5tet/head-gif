
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting...</title>
    <script>
      const img = new Image();
      img.src = "https://head-gif.onrender.com/images/q4stats.gif?uid=pingufire";

      img.onload = () => {
        window.location.href = "https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExcXAwbWgzcWcwZHB4ZTZoYTUwZTQ5ajF4Y3drOW56eDhodXNsemwweCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/rHR8qP1mC5V3G/giphy.gif";
      };

      // Fallback in case pixel fails to load
      setTimeout(() => {
        window.location.href = "https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExcXAwbWgzcWcwZHB4ZTZoYTUwZTQ5ajF4Y3drOW56eDhodXNsemwweCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/rHR8qP1mC5V3G/giphy.gif";
      }, 1000);
    </script>
  </head>
  <body>
    <!-- Transparent fallback if JS is disabled -->
    <noscript>
      <meta http-equiv="refresh" content="1; url=https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExcXAwbWgzcWcwZHB4ZTZoYTUwZTQ5ajF4Y3drOW56eDhodXNsemwweCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/rHR8qP1mC5V3G/giphy.gif">
    </noscript>
  </body>
</html>
